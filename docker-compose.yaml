# ---- Shared Spark Worker Configuration ----
x-spark-common: &spark-common
  image: apache/spark:4.1.0-scala2.13-java21-python3-r-ubuntu
  volumes:
    - ./jobs:/opt/spark/jobs
  networks:
    - airpulsenetwork
  command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
  # Load simulation settings (topics, intervals)
  env_file:
    - simulation.env
  environment:
    SPARK_MODE: Worker
    SPARK_WORKER_CORES: "2"
    SPARK_WORKER_MEMORY: "1g"
    SPARK_MASTER_URL: spark://spark-master:7077
    # Pass AWS Secrets explicitly
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  depends_on:
    spark-master:
      condition: service_healthy

services:
  # -------------------
  # Kafka Broker
  # -------------------
  broker:
    image: confluentinc/cp-kafka:7.7.7
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
    # Load topics from simulation.env (if you use them in producer scripts running here)
    env_file:
      - simulation.env
    environment:
      # --- KRaft Required Settings ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      
      # This variable tells the Confluent script to format the storage automatically
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

      # --- General Settings ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

    networks:
      - airpulsenetwork
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-broker-api-versions --bootstrap-server broker:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------
  # Spark Master
  # -------------------
  spark-master:
    image: apache/spark:4.1.0-scala2.13-java21-python3-r-ubuntu
    hostname: spark-master
    container_name: spark-master
    volumes:
      - ./jobs:/opt/spark/jobs
    ports:
      - "8080:8080"   # Web UI
      - "7077:7077"   # RPC Port
    # Load simulation settings
    env_file:
      - simulation.env
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      # Pass AWS Secrets explicitly
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    networks:
      - airpulsenetwork
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -sf http://spark-master:8080/json > /dev/null && echo > /dev/tcp/spark-master/7077"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077

  # -------------------
  # Spark Workers
  # -------------------
  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    hostname: spark-worker-1

  spark-worker-2:
    <<: *spark-common
    container_name: spark-worker-2
    hostname: spark-worker-2

  spark-worker-3:
    <<: *spark-common
    container_name: spark-worker-3
    hostname: spark-worker-3


# network declaration (bridge is fine for local development)
networks:
  airpulsenetwork:
    driver: bridge